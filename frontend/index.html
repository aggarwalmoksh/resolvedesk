<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <!-- Default SEO — overridden per-page by react-helmet-async -->
    <title>ResolveDesk — Telegram Customer Support for Teams</title>
    <meta name="description" content="Turn Telegram messages into trackable support tickets. Categorize, assign, and resolve — with your whole team." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResolveDesk" />
    <meta property="og:title" content="ResolveDesk — Telegram Customer Support for Teams" />
    <meta property="og:description" content="Turn Telegram messages into trackable support tickets. Categorize, assign, and resolve — with your whole team." />
    <meta property="og:image" content="https://resolvedesk.com/og-image.png" />
    <meta property="og:url" content="https://resolvedesk.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ResolveDesk — Telegram Customer Support for Teams" />
    <meta name="twitter:description" content="Turn Telegram messages into trackable support tickets. Categorize, assign, and resolve." />
    <meta name="twitter:image" content="https://resolvedesk.com/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://resolvedesk.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ResolveDesk",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Turn Telegram messages into trackable support tickets. Categorize, assign, and resolve — with your whole team.",
      "url": "https://resolvedesk.com",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "INR",
        "lowPrice": "0",
        "highPrice": "2499",
        "offerCount": "3"
      },
      "publisher": {
        "@type": "Organization",
        "name": "ResolveDesk",
        "url": "https://resolvedesk.com"
      }
    }
    </script>

    <!-- Speculation rules for instant navigation -->
    <script type="speculationrules">
      {
        "prerender": [{
          "source": "document",
          "where": {
            "and": [
              { "href_matches": "/*" },
              { "not": { "href_matches": ["/*logout*", "/*sign-out*", "/*signout*"] } },
              { "not": { "selector_matches": "a[data-no-prerender], a[data-destructive]" } }
            ]
          },
          "eagerness": "moderate"
        }]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
